[project]
name = "northgate-quant"
version = "0.1.0"
description = "Northgate Quantitative Research: leakage-free forecasting, sentiment and portfolio optimisation."
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["notebooks", "data", "reports"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = ["E501", "E741", "C408", "UP006", "UP035", "UP007", "UP045"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
"scripts/*" = ["E402"]  # scripts add the repo root to sys.path before importing src

[tool.pytest.ini_options]
pythonpath = "."
testpaths = ["tests"]
addopts = "-q"
markers = [
  "slow: long-running model or sentiment tests (deselected in CI)",
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
disallow_untyped_defs = false
exclude = "tests/|notebooks/"
